# release-please keeps a release PR open from conventional commits under packages/client;
# merging it tags client-vX.Y.Z, cuts a GitHub release, and publishes @media-ref/client to npm.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.release.outputs['packages/client--release_created'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4

  publish-client:
    needs: release-please
    if: needs.release-please.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      # npm >= 11.5 for trusted publishing (OIDC)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Build and test
        working-directory: packages/client
        run: bun run test && bun run build
      - name: Pack
        working-directory: packages/client
        # Neither bun nor npm applies publishConfig.exports, so hoist it; bun pack resolves catalog: ranges.
        run: |
          jq '.exports = .publishConfig.exports | del(.publishConfig.exports)' package.json > package.tmp.json
          mv package.tmp.json package.json
          bun pm pack --ignore-scripts --filename "$RUNNER_TEMP/client.tgz"
      - name: Publish
        # Outside the repo: npm refuses to run under the root devEngines (bun only).
        working-directory: ${{ runner.temp }}
        # Auth via npm trusted publishing (OIDC), configured for release.yml; no token secret.
        run: npm publish ./client.tgz --access public --provenance
