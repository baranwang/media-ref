syntax = "proto3";

package mediaref.internal.v1;

import "mediaref/v1/api_key.proto";

enum ApiKeyScope {
  API_KEY_SCOPE_UNSPECIFIED = 0;
  API_KEY_SCOPE_READ_REPORT = 1;
  API_KEY_SCOPE_SUBMIT = 2;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  bool email_verified = 4;
  string role = 5;
}

message ApiKeySummary {
  string id = 1;
  optional string name = 2;
  optional string prefix = 3;
  optional string start = 4;
  bool enabled = 5;
  mediaref.v1.ApiKeyPermissions permissions = 6;
  bool can_submit = 7;
  string created_at = 8;
  optional string expires_at = 9;
}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1;
}

message CreateApiKeyRequest {
  optional string name = 1;
  optional bool can_submit = 2;
  repeated ApiKeyScope scopes = 3;
  optional int32 expires_in = 4;
}

message CreateApiKeyResponse {
  ApiKeySummary api_key = 1;
  string key = 2;
}

message ListApiKeysRequest {}

message ListApiKeysResponse {
  repeated ApiKeySummary api_keys = 1;
  int32 total = 2;
}

message DeleteApiKeyRequest {
  string id = 1;
}

message DeleteApiKeyResponse {
  bool success = 1;
  string id = 2;
}

message UpdateApiKeyRequest {
  string id = 1;
  optional string name = 2;
  optional bool can_submit = 3;
}

message UpdateApiKeyResponse {
  ApiKeySummary api_key = 1;
}

message ApiUsageDay {
  // UTC date, YYYY-MM-DD.
  string date = 1;
  int64 found = 2;
  int64 not_found = 3;
  int64 submitted = 4;
}

message ApiKeyLastUsed {
  string key_id = 1;
  string last_used_at = 2;
}

message GetApiUsageRequest {
  // Days to cover, ending today (UTC). Defaults to 14, at most 90.
  optional int32 days = 1;
}

message GetApiUsageResponse {
  repeated ApiUsageDay days = 1;
  repeated ApiKeyLastUsed last_used = 2;
}

service AccountService {
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc DeleteApiKey(DeleteApiKeyRequest) returns (DeleteApiKeyResponse);
  rpc UpdateApiKey(UpdateApiKeyRequest) returns (UpdateApiKeyResponse);
  // Daily usage across all of the signed-in user's API keys.
  rpc GetApiUsage(GetApiUsageRequest) returns (GetApiUsageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
