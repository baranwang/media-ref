syntax = "proto3";

package mediaref.v1;

import "mediaref/v1/types.proto";

message Lead {
  string id = 1;
  MediaRef target = 2;
  string namespace = 3;
  string native_id = 4;
  optional int32 season = 5;
  optional string variant_description = 6;
  optional string notes = 7;
  string created_at = 8;
}

message CreateLeadRequest {
  MediaRef target = 1;
  string namespace = 2;
  string native_id = 3;
  optional int32 season = 4;
  optional string variant_description = 5;
  optional string notes = 6;
}

message CreateLeadResponse {
  Lead lead = 1;
}

service LeadService {
  rpc CreateLead(CreateLeadRequest) returns (CreateLeadResponse);
}
