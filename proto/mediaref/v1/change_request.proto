syntax = "proto3";

package mediaref.v1;

import "mediaref/v1/types.proto";

message CreateChangeRequestRequest {
  MediaRef target = 1;
  string namespace = 2;
  string native_id = 3;
  optional string raw_native_id = 4;
  optional string variant_id = 5;
  optional string variant_description = 6;
  bool set_default_variant = 7;
  optional string task_id = 8;
  optional string replaces_association_id = 9;
  repeated SegmentInput segments = 10;
}

message CreateChangeRequestResponse {
  ChangeRequest change_request = 1;
}

message GetChangeRequestRequest {
  string id = 1;
}

message GetChangeRequestResponse {
  ChangeRequest change_request = 1;
  // Another approved change request whose association for the same collection and media is live,
  // when this one is not that request (e.g. it was rejected and exploration resubmitted it).
  optional string live_change_request_id = 2;
}

// A comment on a change request, or the review agent's reply to comments (ADR 0003 amendment 2).
message ChangeRequestComment {
  string id = 1;
  string change_request_id = 2;
  // `system:review-agent` on the agent's replies.
  string author_user_id = 3;
  string author_name = 4;
  string content = 5;
  // Comments an agent reply answers; empty on people's comments.
  repeated string reply_to_ids = 6;
  string created_at = 7;
}

message ListChangeRequestCommentsRequest {
  string change_request_id = 1;
}

message ListChangeRequestCommentsResponse {
  // Oldest first: comments and the agent's replies as one thread.
  repeated ChangeRequestComment comments = 1;
}

service ChangeRequestService {
  rpc CreateChangeRequest(CreateChangeRequestRequest) returns (CreateChangeRequestResponse);
  rpc GetChangeRequest(GetChangeRequestRequest) returns (GetChangeRequestResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListChangeRequestComments(ListChangeRequestCommentsRequest) returns (ListChangeRequestCommentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
