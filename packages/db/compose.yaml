services:
  postgres:
    image: postgres:19-alpine
    container_name: media-ref-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: media_ref_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - media_ref_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d media_ref_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  media_ref_postgres_data:
