version: v2
clean: true
plugins:
  - local: protoc-gen-es
    out: packages/client/src/gen
    opt:
      - target=ts
      - import_extension=.ts
  # Proto comments as a lookup table for the MCP server's tool descriptions.
  - local: ["node", "scripts/protoc-gen-proto-docs.ts"]
    out: apps/api/src/gen
    strategy: all
    opt:
      - target=ts
