version: v2
clean: true
plugins:
  - local: protoc-gen-es
    out: packages/client/src/gen
    opt:
      - target=ts
      - import_extension=.ts
  # OpenAPI 3.1 of the public API, comments included; the MCP server reads its tools from it.
  - remote: buf.build/community/sudorandom-connect-openapi:v0.28.0
    out: apps/api/src/gen
    opt:
      - format=json
      - path=openapi.json
      - services=mediaref.v1.*
      - features=connectrpc
      - content-types=json
      - trim-unused-types
